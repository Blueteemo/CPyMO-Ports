# Scoped to CPyMO.sh. Keep MENU and inherited device mappings.
config_save_on_exit = "false"
log_verbosity = "false"
log_to_file = "false"
# Block game inputs immediately while the MENU hotkey modifier is held.
input_hotkey_block_delay = "0"

# CPyMO music: Lanczos sinc LOWER (quality 2): 8 taps at a unity ratio before SIMD rounding.
audio_resampler = "sinc"
audio_resampler_quality = "2"
